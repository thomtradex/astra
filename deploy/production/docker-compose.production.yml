services:

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: astra_user
      POSTGRES_PASSWORD: 8c9f2b4d7e6a1f3c9e5b7a2d4f8c6e1a9b3d5f7a2c8e4b6d9f1a3c5e7b9d2f4
      POSTGRES_DB: astra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.production
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3001:3001"

volumes:
  postgres_data:

# Production security notes:
# - Run behind reverse proxy
# - Enable HTTPS
# - Rotate secrets periodically
# - Restrict database exposure
