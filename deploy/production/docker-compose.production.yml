services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: astra_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: astra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U astra_user']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.production
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - '3001:3001'

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.production
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      COOKIE_SECURE: 'false'
      API_URL: ${API_URL:?API_URL is required}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    ports:
      - '3000:3000'

volumes:
  postgres_data:

# Production security notes:
# - Run behind reverse proxy
# - Enable HTTPS
# - Rotate secrets periodically
# - Restrict database exposure
