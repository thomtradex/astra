services:

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: astra_user
      POSTGRES_PASSWORD: CHANGE_PASSWORD
      POSTGRES_DB: astra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.production
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3001:3001"

volumes:
  postgres_data:
