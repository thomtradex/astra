name: Astra Production Pipeline

on:
  push:
    branches:
      - release/commercial-ready
      - feat/production-readiness

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Architecture
        run: pnpm architecture:check
